[VR]
; Game units per real-world meter (TDU uses meters). Raise it if the world feels small, lower it if it feels huge.
WorldScale=1.0
; Menus, HUD and cursor are shown on a flat virtual screen in front of you (press F8 to recenter it).
; UiFov: how wide that screen is, in degrees. UiDistance: how far away it floats, in meters.
UiFov=70
UiDistance=1.5
; HeadLook=1 turns the game's own in-car camera with your head (its TrackIR head-look), so the game
; draws what is where you look. 0 = off (objects can then be missing when you look to the side).
HeadLook=1
; AutoDrive=1 skips the menus at startup: it continues your saved game from the main menu and leaves
; the house for your car, so you start driving without touching a menu in the headset. 0 = off.
AutoDrive=1
; GpuCopy=1 runs the game's Direct3D 9 on Direct3D 12 (D3D9On12), so each frame goes to the headset
; without a trip through system memory: higher and steadier frame rate. The game window on the desktop
; then stops updating (use SteamVR's mirror). 0 = the old CPU copy.
GpuCopy=1
; DXVK=1 (experimental) runs the game's Direct3D 9 on DXVK (Vulkan) instead of D3D9On12: about twice the
; frame rate, enough for each eye to get a new image on every headset frame, and the desktop window keeps
; updating. Needs dxvk_d3d9.dll next to the game: the 32-bit d3d9.dll (x32 folder) of a DXVK release from
; github.com/doitsujin/dxvk, renamed. 0 = D3D9On12 (GpuCopy above).
DXVK=0
; SimLock=1 (experimental): in the car, the game's simulation steps once per eye pair instead of on its
; own 100 Hz timer, so both eyes show the same moment and motion advances evenly. 0 = off.
SimLock=0
